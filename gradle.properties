android.useAndroidX=true
# AGP 9.1 matches the existing Gradle 9.3 toolchain. Keep the legacy Kotlin/DSL path while the
# project still applies the Kotlin Android and KSP plugins; migrate to built-in Kotlin separately.
android.builtInKotlin=false
android.newDsl=false
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
