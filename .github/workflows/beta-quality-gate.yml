name: Beta quality gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-quality:
    name: Tests, lint, release budget and 16 KiB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run beta quality gate
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleRelease
          :app:reportReleaseApkSize
          :app:checkReleaseNativeAlignment

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-quality-evidence
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/release/
          if-no-files-found: ignore
          retention-days: 14
